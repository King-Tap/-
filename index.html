<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خاتم التسبيح المطور</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* جسم الخاتم */
        .tally-counter {
            width: 180px;
            height: 220px;
            background-color: #b0c4de;
            border-radius: 50px 50px 70px 70px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 -5px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            border: 2px solid #a0b4cc;
        }

        /* الشاشة */
        .screen-container {
            width: 135px;
            height: 65px;
            background-color: #222;
            border-radius: 10px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 4px solid #333;
        }

        #display {
            color: #9dbb9d;
            font-family: 'Courier New', Courier, monospace;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* الزر الكبير */
        .btn-count {
            width: 75px;
            height: 75px;
            background: linear-gradient(145deg, #e6e6e6, #ffffff);
            border: 2px solid #ccc;
            border-radius: 50%;
            margin-top: 25px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.05s;
        }

        .btn-count:active {
            transform: scale(0.9);
        }

        /* الزر الصغير */
        .btn-reset {
            width: 25px;
            height: 25px;
            background: #ddd;
            border: 1px solid #bbb;
            border-radius: 50%;
            position: absolute;
            right: 35px;
            bottom: 85px;
            cursor: pointer;
        }

        /* رسالة التنبيه العائمة */
        #notification {
            position: fixed;
            top: 20px;
            background-color: #4CAF50;
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none; /* مخفية افتراضياً */
            z-index: 1000;
            animation: fadeInOut 4s forwards;
            font-weight: bold;
            text-align: center;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-20px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        .label-text { font-size: 11px; color: #444; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="notification"></div>

    <div class="tally-counter">
        <div class="screen-container">
            <div id="display">00000</div>
        </div>
        <button class="btn-count" onclick="increment()"></button>
        <button class="btn-reset" onclick="resetCounter()"></button>
        <div class="label-text">تسبـيح</div>
    </div>

    <script>
        // استعادة القيمة المحفوظة عند تحميل الصفحة
        let count = localStorage.getItem('tasbihCount') ? parseInt(localStorage.getItem('tasbihCount')) : 0;
        const display = document.getElementById('display');
        const notification = document.getElementById('notification');

        // تحديث الشاشة عند البدء
        updateDisplay();

        function updateDisplay() {
            display.innerText = count.toString().padStart(5, '0');
            // حفظ القيمة في ذاكرة المتصفح
            localStorage.setItem('tasbihCount', count);
        }

        function increment() {
            if (count < 99999) {
                count++;
                updateDisplay();
                checkMilestone();
            }
        }

        function resetCounter() {
            if (confirm("هل تريد تصفير العداد؟")) {
                count = 0;
                updateDisplay();
            }
        }

        function checkMilestone() {
            // التحقق إذا كان الرقم يقبل القسمة على 1000 وليس صفراً
            if (count > 0 && count % 1000 === 0) {
                showNotification(`لقد وصلت ${count} تسبيحة، بارك الله فيك أكمل`);
            }
        }

        function showNotification(message) {
            notification.innerText = message;
            notification.style.display = 'block';
            
            // إعادة تشغيل الأنميشن
            notification.style.animation = 'none';
            notification.offsetHeight; 
            notification.style.animation = null;

            // إخفاء العنصر بعد 4 ثوانٍ تماماً
            setTimeout(() => {
                notification.style.display = 'none';
            }, 4000);
        }

        // دعم زر المسافة
        window.addEventListener('keydown', (e) => {
            if (e.code === "Space") {
                e.preventDefault(); // منع نزول الصفحة لأسفل
                increment();
            }
        });
    </script>
</body>
</html>
